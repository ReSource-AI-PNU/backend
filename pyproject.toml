[project]
name = "resource-ai-backend"
version = "0.1.0"
description = "Re:Source AI backend — 산업 폐기물 판정과 묶음 수거 매칭 에이전트 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=3.50,<4",
]

[project.optional-dependencies]
foundry-check = ["openai>=3.50,<4"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
