[project]
name = "resource-ai-backend"
version = "0.1.0"
description = "Re:Source AI backend — 산업 폐기물 판정과 묶음 수거 매칭 에이전트 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=3.50,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "ortools>=9.12,<10",
]

[project.optional-dependencies]
foundry-check = ["openai>=3.50,<4"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# ① 식별 모델 추론 (RT-DETRv2, ByteTrack). 학습 코드는 별도 저장소. API 컨테이너에는 이 extra 만 들어간다.
ml = [
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.57",
    "supervision>=0.25,<0.30",  # 0.30+ 에서 ByteTrack 이 빠짐(trackers 패키지로 분리)
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pillow>=10",
]
# 설계안 v3 판단 도구 MCP 서버 (app/v3/mcp_server.py). API와 업체 측 서비스는 기본 의존성만으로 돈다.
# 상한 <2는 일부러 둔 것이다. mcp_server.py는 MCP Python SDK 1.x의 저수준 API(@server.list_tools(),
# @server.call_tool(), inputSchema)를 쓰고, 2.x에서는 이 API가 없어졌다(공식 이전 안내서의
# "Lowlevel Server: decorator-based handlers replaced with constructor on_* params"). Agent Framework의
# MCP 도구는 mcp>=2.2,<3을 요구하므로 MCP 서버 이미지와 Agent Framework 이미지는 따로 만든다(README).
v3 = [
    "mcp>=1.10,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
