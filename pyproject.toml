[project]
name = "resource-ai-backend"
version = "0.1.0"
description = "Re:Source AI backend — 산업 폐기물 판정과 묶음 수거 매칭 에이전트 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=3.50,<4",
]

[project.optional-dependencies]
foundry-check = ["openai>=3.50,<4"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# ① 식별 모델 추론 (RT-DETRv2, ByteTrack). 학습 코드는 별도 저장소. API 컨테이너에는 이 extra 만 들어간다.
ml = [
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.57",
    "supervision>=0.25,<0.30",  # 0.30+ 에서 ByteTrack 이 빠짐(trackers 패키지로 분리)
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pillow>=10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
