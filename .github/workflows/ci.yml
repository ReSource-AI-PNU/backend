name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ruff · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12" # Dockerfile과 같은 버전
          enable-cache: true

      # ml extra(torch)는 넣지 않는다. 테스트는 스텁 탐지기로 돈다.
      - name: 의존성 설치
        run: uv sync --extra dev --locked

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 이미지를 올리지 않고 빌드만 확인한다. torch 레이어는 캐시에서 가져온다.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
