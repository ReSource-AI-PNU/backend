name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ruff · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12" # Dockerfile과 같은 버전
          enable-cache: true

      # ml extra(torch)는 넣지 않는다. 테스트는 스텁 탐지기로 돈다.
      # mcp-server extra(mcp)는 tests/v3/test_mcp_server.py가 건너뛰지 않고 돌게 넣는다.
      - name: 의존성 설치
        run: uv sync --extra dev --extra mcp-server --locked

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q

      # 평가 설계 16장의 매 푸시 묶음 가운데 규칙 정책(모델 미연결)으로 도는 것: 시험셋 L4 70건과
      # 변형 80건, L3 결정적 지표, L6 노출·주입, L5. 네트워크를 쓰지 않는다. 판정(동결 해시, 위반 0,
      # 노출 등)은 위 pytest의 tests/v3/test_eval_*.py가 하고, 이 단계는 CLI가 끝까지 도는지 보고
      # 리포트를 실행 요약에 붙인다. 실제 모델 평가는 eval-model.yml(수동)이다.
      - name: 평가(규칙 정책)
        run: |
          uv run python -m scripts.v3.eval.run_all --split test --llm rule \
            --layers L3,L4,L5,L6 --resamples 2000 --no-raw --no-report \
            --out-dir "$RUNNER_TEMP/eval"
          cat "$RUNNER_TEMP"/eval/*-test-rule.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 이미지를 올리지 않고 빌드만 확인한다. torch 레이어는 캐시에서 가져온다.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
