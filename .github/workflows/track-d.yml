name: Track D platform
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/platform/**', 'app/schemas.py', 'migrations/**', 'scripts/**', 'tests/test_platform*', 'pyproject.toml', 'uv.lock', '.github/workflows/track-d.yml']
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: resource_test
          POSTGRES_USER: resource_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U resource_test -d resource_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TRACK_D_TEST_POSTGRES_URL: postgresql+psycopg://resource_test:ephemeral-ci-only@localhost:5432/resource_test
      PLATFORM_DEMO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check app/platform scripts migrations tests/test_platform.py tests/test_platform_postgis.py
      - run: uv run pytest -q
      - run: uv run python -m scripts.export_openapi && git diff --exit-code docs/openapi.json
