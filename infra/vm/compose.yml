# 앱 VM(infra/vm.bicep)에서 돌리는 서비스. infra/vm/deploy-vm.sh 가 이 파일을 /opt/rsai 로 올린다.
# 소스는 /opt/rsai/src/{backend,frontend}, 환경 변수 파일은 /opt/rsai/env/*.env(배포 때 Key Vault에서 만든다)다.
# 인터넷에는 Caddy(80·443)만 열린다. 백엔드와 Ollama는 이 Compose 네트워크 안에서만 닿는다.
name: rsai

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS가 필요하다}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  # 브라우저는 프런트만 부른다. /api/v3 는 프런트 서버가 조직 토큰을 붙여 백엔드로 넘긴다.
  frontend:
    build:
      context: ./src/frontend
      args:
        NEXT_PUBLIC_API_BASE: /api/v3
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    image: rsai-frontend:local
    restart: unless-stopped
    env_file: ./env/frontend.env
    volumes:
      - frontend_db:/app/.mock-db
    depends_on:
      - backend

  backend:
    build:
      context: ./src/backend
      args:
        EXTRAS: ml
    image: rsai-backend:local
    restart: unless-stopped
    env_file: ./env/backend.env
    environment:
      APP_ROLE: api
    volumes:
      - backend_models:/app/models

  # 사진·영상 탐지 채점 서버(app/ml/score_api.py)는 이 VM에 두지 않는다. 2026-11-22부터 H100 계산 인스턴스의
  # rsai-detector(infra/h100/detector)가 GPU로 돌고, 백엔드가 사설 주소로 부른다(V3_DETECTOR_ENDPOINT).
  # 배포의 up --remove-orphans가 예전 detector 컨테이너를 지운다

  # 배포 때 한 번 돌리고 끝난다: docker compose run --rm -T migrate
  migrate:
    image: rsai-backend:local
    env_file: ./env/backend.env
    environment:
      APP_ROLE: migrate
    profiles:
      - tools

  # 업체 측 오픈 모델(Ollama)은 이 VM에 두지 않는다. Azure ML의 H100 계산 인스턴스(rsai-h100)에서 돌고,
  # 백엔드가 VNet 피어링으로 사설 주소에 닿는다(OLLAMA_BASE_URL, deploy-vm.sh USE_OLLAMA=h100).

volumes:
  caddy_data: {}
  caddy_config: {}
  frontend_db: {}
  backend_models: {}
