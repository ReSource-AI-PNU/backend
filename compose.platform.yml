services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: resource
      POSTGRES_USER: resource
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resource -d resource"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  platform-postgres:
